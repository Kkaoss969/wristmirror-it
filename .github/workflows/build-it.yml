name: Build APK (italiano)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa SDK 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WristMirror-it-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
