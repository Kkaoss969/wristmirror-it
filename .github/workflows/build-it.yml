name: Build APK (italiano)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa SDK 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || true
      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WristMirror-it-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Pubblica APK sul branch apk
        run: |
          SHA=$(git rev-parse --short HEAD)
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/WristMirror-$VER-it-$SHA.apk
          cd /tmp/out && git init -q -b apk && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "APK $SHA" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
